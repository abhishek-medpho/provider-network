services:
  postgres:
    image: postgres:16-alpine
    container_name: cpp-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-care_provider_platform}
    volumes:
      - cpp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpp} -d ${POSTGRES_DB:-care_provider_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cpp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-care_provider_platform}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${APP_BASE_URL}}
      ULTRAMSG_INSTANCE_ID: ${ULTRAMSG_INSTANCE_ID}
      ULTRAMSG_TOKEN: ${ULTRAMSG_TOKEN}
      ULTRAMSG_BASE_URL: ${ULTRAMSG_BASE_URL:-https://api.ultramsg.com}
      ULTRAMSG_DEFAULT_COUNTRY_CODE: ${ULTRAMSG_DEFAULT_COUNTRY_CODE:-91}
      WHATSAPP_LOGIN_LINK_TTL_MIN: ${WHATSAPP_LOGIN_LINK_TTL_MIN:-15}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET required}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      # Point the local-file storage driver at the volume-mounted directory.
      # Default (process.cwd()/uploads) lands in /app/uploads which is not
      # writable by the nextjs user and not on a persisted volume.
      STORAGE_LOCAL_ROOT: /app/public/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - cpp_uploads:/app/public/uploads

volumes:
  cpp_pg_data:
  cpp_uploads:
